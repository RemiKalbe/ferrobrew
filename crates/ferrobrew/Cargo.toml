[package]
name = "ferrobrew"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "ferrobrew — a Rust reimplementation of Homebrew's brew."
license = "BSD-2-Clause"
repository = "https://github.com/RemiKalbe/ferrobrew"
default-run = "ferrobrew"

[lib]
name = "ferrobrew"
path = "src/lib.rs"

[[bin]]
name = "ferrobrew"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
